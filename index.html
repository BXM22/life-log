<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Life Log">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Apply theme before CSS paints to avoid a light flash when dark is preferred.
    (function () {
      try {
        var raw = JSON.parse(localStorage.getItem('lifelog.settings') || 'null');
        var theme = raw && (raw.theme === 'light' || raw.theme === 'dark' || raw.theme === 'system') ? raw.theme : 'system';
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var effective = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = effective;
        document.documentElement.style.colorScheme = effective;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', effective === 'dark' ? '#141210' : '#FFFFFF');
        var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (bar) bar.setAttribute('content', effective === 'dark' ? 'black-translucent' : 'default');
      } catch (e) { /* storage blocked or corrupt: stay light */ }
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Life Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="stylesheet" href="src/styles/today.css">
  <link rel="stylesheet" href="src/styles/forma.css">
  <link rel="stylesheet" href="src/styles/windows.css">
  <link rel="stylesheet" href="src/styles/win-log.css">
  <link rel="stylesheet" href="src/styles/win-learn.css">
  <link rel="stylesheet" href="src/styles/win-notes.css">
  <link rel="stylesheet" href="src/styles/workout-today.css">
  <link rel="stylesheet" href="src/styles/workout-sheets.css">
  <link rel="stylesheet" href="src/styles/workout-pages.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
    // Show real errors on screen instead of a blank page.
    (function () {
      function show(msg) {
        var el = document.getElementById('app');
        if (!el) return;
        var box = document.getElementById('errbox');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'errbox';
          box.style.cssText = 'white-space:pre-wrap;word-break:break-word;margin:12px;padding:8px;background:#000000;color:#ff7a6b;border:2px dashed #ff7a6b;font:14px monospace';
          el.parentNode.insertBefore(box, el);
        }
        box.textContent += msg + '\n';
      }
      window.addEventListener('error', function (e) {
        show('ERROR: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'load failed') +
          (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        show('REJECTED: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
      });
      setTimeout(function () {
        var el = document.getElementById('app');
        if (el && !el.innerHTML.trim()) show('App did not start.\nURL: ' + location.href + '\nUA: ' + navigator.userAgent);
      }, 3000);
    })();
  </script>
  <script type="module" src="src/ui/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || reloaded) return;
        reloaded = true;
        location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        }).catch(() => { /* offline support is optional */ });
      });
    }
  </script>
</body>
</html>
